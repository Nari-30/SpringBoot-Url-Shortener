<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <div class="background-glow"></div>

    <div class="auth-container">

        <div class="auth-box">

            <h2>Register</h2>

            <input
                type="text"
                id="registerUsername"
                placeholder="Username">

            <input
                type="email"
                id="registerEmail"
                placeholder="Email">

            <input
                type="password"
                id="registerPassword"
                placeholder="Password">

            <button onclick="registerUser()">
                Register
            </button>

            <p style="text-align:center;">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
